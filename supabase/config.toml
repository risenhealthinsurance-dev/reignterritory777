project_id = "reign-territory-field-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://reignterritory777.vercel.app"
additional_redirect_urls = [
  "https://reignterritory777.vercel.app/**",
  "http://127.0.0.1:5173",
  "http://localhost:5173",
  "http://localhost:3000",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.field-ai]
verify_jwt = true

[functions.enrich-business]
verify_jwt = true

[functions.import-fort-pierce-gis]
verify_jwt = true

[functions.plan-route]
verify_jwt = true
